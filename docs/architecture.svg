<svg width="820" height="580" viewBox="0 0 820 580" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b96ad" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="580" rx="16" fill="#0c1220"/>
  <text x="32" y="34" fill="#e7ecf6" font-size="16" font-weight="600">RouteMind architecture</text>

  <g stroke="#8b96ad" stroke-width="1.6">
    <line x1="250" y1="116" x2="250" y2="126" marker-end="url(#a)"/>
    <line x1="250" y1="204" x2="250" y2="214" marker-end="url(#a)"/>
    <line x1="250" y1="292" x2="250" y2="302" marker-end="url(#a)"/>
    <line x1="250" y1="380" x2="250" y2="390" marker-end="url(#a)"/>
    <line x1="250" y1="468" x2="250" y2="478" marker-end="url(#a)"/>
    <line x1="508" y1="333" x2="374" y2="333" marker-end="url(#a)"/>
    <line x1="610" y1="392" x2="610" y2="366" marker-end="url(#a)"/>
  </g>

  <g>
    <rect x="130" y="58" width="240" height="58" rx="10" fill="#1b2540" stroke="#263252"/>
    <rect x="130" y="58" width="4" height="58" rx="2" fill="#35d6b0"/>
    <text x="150" y="82" fill="#e7ecf6" font-size="15" font-weight="600">Your request</text>
    <text x="150" y="101" fill="#8b96ad" font-size="12">stops and rules, in plain English</text>
  </g>
  <g>
    <rect x="130" y="146" width="240" height="58" rx="10" fill="#1b2540" stroke="#263252"/>
    <rect x="130" y="146" width="4" height="58" rx="2" fill="#6ea8ff"/>
    <text x="150" y="170" fill="#e7ecf6" font-size="15" font-weight="600">Planner agent</text>
    <text x="150" y="189" fill="#8b96ad" font-size="12">coordinates the team</text>
  </g>
  <g>
    <rect x="130" y="234" width="240" height="58" rx="10" fill="#1b2540" stroke="#263252"/>
    <rect x="130" y="234" width="4" height="58" rx="2" fill="#6ea8ff"/>
    <text x="150" y="258" fill="#e7ecf6" font-size="15" font-weight="600">Data + conditions agents</text>
    <text x="150" y="277" fill="#8b96ad" font-size="12">maps, traffic, weather</text>
  </g>
  <g>
    <rect x="130" y="322" width="240" height="58" rx="10" fill="#1b2540" stroke="#263252"/>
    <rect x="130" y="322" width="4" height="58" rx="2" fill="#6ea8ff"/>
    <text x="150" y="346" fill="#e7ecf6" font-size="15" font-weight="600">Optimizer agent</text>
    <text x="150" y="365" fill="#8b96ad" font-size="12">solves the route with OR-Tools</text>
  </g>
  <g>
    <rect x="130" y="410" width="240" height="58" rx="10" fill="#1b2540" stroke="#263252"/>
    <rect x="130" y="410" width="4" height="58" rx="2" fill="#6ea8ff"/>
    <text x="150" y="434" fill="#e7ecf6" font-size="15" font-weight="600">Explainer agent</text>
    <text x="150" y="453" fill="#8b96ad" font-size="12">explains each choice, live</text>
  </g>
  <g>
    <rect x="130" y="498" width="240" height="58" rx="10" fill="#1b2540" stroke="#263252"/>
    <rect x="130" y="498" width="4" height="58" rx="2" fill="#35d6b0"/>
    <text x="150" y="522" fill="#e7ecf6" font-size="15" font-weight="600">Live map + chat</text>
    <text x="150" y="541" fill="#8b96ad" font-size="12">the interactive output</text>
  </g>

  <g>
    <rect x="510" y="322" width="220" height="58" rx="10" fill="#1b2540" stroke="#263252"/>
    <rect x="510" y="322" width="4" height="58" rx="2" fill="#f6a821"/>
    <text x="530" y="346" fill="#e7ecf6" font-size="15" font-weight="600">Travel-time model</text>
    <text x="530" y="365" fill="#8b96ad" font-size="12">learns from past trips</text>
  </g>
  <g>
    <rect x="510" y="410" width="220" height="58" rx="10" fill="#1b2540" stroke="#263252"/>
    <rect x="510" y="410" width="4" height="58" rx="2" fill="#ff7ab6"/>
    <text x="530" y="434" fill="#e7ecf6" font-size="15" font-weight="600">Unlearning agent</text>
    <text x="530" y="453" fill="#8b96ad" font-size="12">erases a customer on request</text>
  </g>

  <g font-size="12" fill="#8b96ad">
    <rect x="130" y="20" width="12" height="12" rx="3" fill="#6ea8ff"/><text x="148" y="30">AI agents</text>
    <rect x="228" y="20" width="12" height="12" rx="3" fill="#f6a821"/><text x="246" y="30">learned model</text>
    <rect x="352" y="20" width="12" height="12" rx="3" fill="#ff7ab6"/><text x="370" y="30">unlearning</text>
    <rect x="452" y="20" width="12" height="12" rx="3" fill="#35d6b0"/><text x="470" y="30">you and output</text>
  </g>
</svg>
